on:
  workflow_dispatch:
  release:
    types: [created]
  
jobs:
  publish-release:
    uses: codefori/.github/.github/workflows/release.yaml@main
    permissions:
      contents: read
      id-token: write
    with:
       publish_types: true
       is_prerelease: ${{ github.event_name != 'release' }}
    secrets: inherit
